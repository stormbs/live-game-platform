<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đua Xe Leo Núi</title>
<link rel="stylesheet" href="/shared/ui.css">
<script src="/shared/ui.js"></script>
<style>
  :root { --ui-accent:#FFCF3D; --ui-accent-2:#1E90FF; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:1080px; height:1920px; overflow:hidden; color:#fff;
    font-family:'Be Vietnam Pro',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  body { background:#000; }
  .wrap { position:relative; width:1080px; height:1920px; padding:30px 36px 0;
    background:#77bfe8 url('/shared/bg/dua-xe-leo-nui.webp') center bottom/cover no-repeat; }
  .wrap::before { content:""; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(180deg,rgba(20,65,105,.48),rgba(34,99,43,.12) 42%,rgba(20,55,30,.5)); }
  header,.board,.mountain,.ticker,.howto,.status { position:relative; z-index:1; }
  header { display:flex; justify-content:space-between; align-items:center;
    background:rgba(0,0,0,.62); border:3px solid rgba(255,255,255,.24);
    border-radius:20px; padding:18px 24px; }
  header h1 { font-size:46px; text-shadow:0 3px 0 rgba(0,0,0,.45); }
  #demo-badge { position:absolute; top:164px; right:36px; z-index:50;
    background:#ffd23f; color:#241b00; font-size:24px; font-weight:900;
    padding:8px 16px; border-radius:999px; box-shadow:0 4px 14px rgba(0,0,0,.35); display:none; }
  #demo-badge.on { display:block; }
  .clock { font-size:44px; font-weight:900; background:#ffcf3d; color:#222;
    border-radius:14px; padding:6px 18px; transition:background .3s; }
  .clock.low { background:#ff3b30; color:#fff; animation:ui-blink-soft 1s ease-in-out infinite alternate; }
  .round { font-size:26px; color:#ffe9a0; margin-top:4px; text-align:right; }
  .board { margin-top:40px; background:rgba(0,0,0,.62); border-radius:20px; padding:14px 20px; }
  .brow { display:flex; align-items:center; gap:14px; font-size:29px; padding:8px 0; border-bottom:1px dashed rgba(255,255,255,.2); }
  .brow:last-child { border-bottom:0; }
  .brow.lead { background:rgba(255,207,61,.22); border-radius:12px; padding:8px 10px; animation:lead-glow 1.6s ease-in-out infinite; }
  @keyframes lead-glow { 0%,100%{box-shadow:0 0 0 rgba(255,207,61,0)} 50%{box-shadow:0 0 18px rgba(255,207,61,.75)} }
  .brow img,.ava { width:54px; height:54px; border-radius:50%; object-fit:cover; background:#f1a66e;
    display:inline-flex; align-items:center; justify-content:center; font-size:28px; font-weight:900; flex:none; color:#402316; }
  .binfo { flex:1; min-width:0; display:flex; flex-direction:column; gap:6px; }
  .brow b { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pts { font-weight:900; color:#ffe9a0; white-space:nowrap; }
  .ui-bar { height:10px; border-radius:5px; background:rgba(255,255,255,.18); overflow:hidden; }
  .ui-bar i { display:block; height:100%; border-radius:5px;
    background:linear-gradient(90deg,var(--ui-accent),var(--ui-accent-2)); transition:width .5s ease; }
  .mountain { margin-top:14px; height:1050px; border-radius:24px; overflow:hidden;
    background:#639a58 url('/shared/bg/dua-xe-leo-nui.webp') center/cover no-repeat;
    border:4px solid rgba(255,255,255,.78); box-shadow:inset 0 -180px 120px rgba(25,65,28,.38); }
  .mountain::after { content:""; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(180deg,rgba(130,210,255,.18),transparent 36%,rgba(23,71,30,.3)); }
  .ridge,.trees,.sun,.cloud { pointer-events:none; }
  .ridge { position:absolute; left:0; right:0; }
  .ridge.far { top:0; height:380px; background:#b8e4c0; opacity:.28;
    clip-path:polygon(0 100%,0 55%,12% 30%,26% 52%,40% 18%,55% 48%,70% 25%,85% 55%,100% 35%,100% 100%); }
  .ridge.near { top:260px; height:400px; background:#4c893f; opacity:.34;
    clip-path:polygon(0 100%,0 60%,15% 35%,30% 60%,48% 28%,65% 58%,82% 32%,100% 60%,100% 100%); }
  .trees { position:absolute; left:0; right:0; bottom:0; height:64px; }
  .tree { position:absolute; bottom:0; width:0; height:0; border-left:20px solid transparent; border-right:20px solid transparent; border-bottom:48px solid #23652d; }
  .tree::after { content:""; position:absolute; left:-4px; top:48px; width:8px; height:14px; background:#6d4c41; }
  .tree.small { border-left-width:14px; border-right-width:14px; border-bottom-width:34px; }
  .tree.small::after { top:34px; height:10px; }
  .sun { position:absolute; top:24px; right:40px; width:82px; height:82px; border-radius:50%; background:#ffd95b;
    box-shadow:0 0 0 12px rgba(255,220,100,.18),0 0 35px rgba(255,220,100,.7); }
  .cloud { position:absolute; width:130px; height:38px; border-radius:30px; background:rgba(255,255,255,.76);
    animation:cloud-drift 24s ease-in-out infinite alternate; }
  .cloud::before,.cloud::after { content:""; position:absolute; bottom:8px; border-radius:50%; background:inherit; }
  .cloud::before { left:24px; width:54px; height:54px; }
  .cloud::after { left:66px; width:42px; height:42px; }
  @keyframes cloud-drift { from{transform:translateX(0)} to{transform:translateX(60px)} }
  .flag { position:absolute; right:18px; top:26px; z-index:3; text-align:center; font-size:0; }
  .flag::before { content:""; display:inline-block; width:70px; height:52px;
    background:conic-gradient(#222 25%,#fff 0 50%,#222 0 75%,#fff 0) 0 0/26px 26px;
    border:4px solid #222; transform:skewY(-8deg); }
  .flag::after { content:""; display:block; width:7px; height:82px; background:#74472a; margin:-2px auto 0; }
  .flag small { display:block; font-size:22px; font-weight:900; color:#222;
    background:rgba(255,255,255,.9); border-radius:10px; padding:2px 10px; }
  .marshal { position:absolute; right:140px; top:16px; z-index:20; text-align:center; pointer-events:none;
    animation:marshal-idle 3s ease-in-out infinite alternate; }
  @keyframes marshal-idle { from{transform:translateY(0)} to{transform:translateY(-4px)} }
  .marshal-flag { display:inline-block; width:50px; height:34px; border:4px solid #222;
    background:conic-gradient(#e33 25%,#fff 0 50%,#e33 0 75%,#fff 0) 0 0/17px 17px;
    transform:rotate(-22deg); transform-origin:20% 90%; }
  .marshal-body { position:relative; width:54px; height:58px; margin:-3px auto 0; border-radius:27px 27px 14px 14px;
    background:#274e80; border:4px solid #172b49; }
  .marshal-body::before { content:""; position:absolute; width:31px; height:31px; left:8px; top:-28px; border-radius:50%;
    background:#d89062; border:4px solid #422818; }
  .marshal-label { display:inline-block; font-size:17px; font-weight:900; color:#222;
    background:rgba(255,255,255,.9); border-radius:8px; padding:1px 8px; margin-top:2px; }
  .marshal.waving .marshal-flag { animation:flagwave .4s ease-in-out infinite alternate; }
  .marshal.waving .marshal-body { animation:marshal-cheer .4s ease-in-out infinite alternate; }
  @keyframes flagwave { from{transform:rotate(-24deg)} to{transform:rotate(28deg)} }
  @keyframes marshal-cheer { from{transform:translateY(0) rotate(-4deg)} to{transform:translateY(-8px) rotate(4deg)} }
  .marshal.waving { filter:drop-shadow(0 0 15px #ffe45b); }
  .lane { position:absolute; left:0; right:0; height:200px; border-bottom:3px dashed rgba(255,255,255,.45); z-index:2; }
  .lane .track { position:absolute; left:30px; right:60px; top:118px; height:14px; border-radius:7px;
    background:#4a4a4a; box-shadow:inset 0 2px 4px rgba(0,0,0,.55); }
  .lane .track::after { content:""; position:absolute; left:0; right:0; top:50%; height:3px; margin-top:-1px;
    background:repeating-linear-gradient(90deg,#fff 0 24px,transparent 24px 48px); opacity:.85; }
  .milestone { position:absolute; top:0; bottom:0; border-left:3px dashed rgba(255,255,255,.65); z-index:1; }
  .milestone span { position:absolute; top:10px; left:-34px; width:68px; text-align:center; font-size:20px; font-weight:900;
    color:#fff; background:rgba(0,0,0,.58); border-radius:10px; padding:2px 6px; }
  .milestone.hit { animation:milestone-hit .8s ease; }
  @keyframes milestone-hit { 50%{filter:brightness(2.2); border-color:#ffe45b} }
  .car { position:absolute; top:46px; transition:left 1s linear; z-index:3; text-align:center; width:300px; margin-left:-150px; }
  .car .tag { background:rgba(0,0,0,.78); border:3px solid rgba(255,255,255,.42); border-radius:14px;
    padding:5px 12px 5px 5px; font-size:24px; font-weight:900; white-space:nowrap; display:inline-flex;
    align-items:center; gap:8px; max-width:300px; overflow:visible; text-shadow:0 2px 4px rgba(0,0,0,.7); }
  .tag-ava,.tag-ava-fb { width:36px; height:36px; border-radius:50%; object-fit:cover; flex:none;
    background:#f1a66e; display:inline-flex; align-items:center; justify-content:center; font-size:22px;
    font-weight:900; color:#402316; border:2px solid rgba(255,255,255,.9); }
  .tag-name { min-width:0; overflow:visible; white-space:nowrap; }
  .car .body { position:relative; width:132px; height:66px; margin:6px auto 0;
    filter:drop-shadow(0 8px 6px rgba(0,0,0,.35)); }
  .body .chassis { position:absolute; left:0; right:0; bottom:14px; height:40px; border-radius:20px 28px 10px 14px;
    background:linear-gradient(180deg,var(--car-c,#ffcf3d),var(--car-c2,#d9a400)); box-shadow:0 6px 10px rgba(0,0,0,.35); }
  .body .cabin { position:absolute; left:40px; top:0; width:52px; height:28px; border-radius:14px 18px 4px 4px;
    background:linear-gradient(180deg,#bfe9ff,#5fa8d3); border:2px solid rgba(0,0,0,.3); }
  .body .wheel { position:absolute; bottom:0; width:34px; height:34px; border-radius:50%; background:#222; border:3px solid #111; }
  .body .wheel::after { content:""; position:absolute; inset:7px; border-radius:50%;
    background:conic-gradient(#ddd 0 25%,#555 25% 50%,#ddd 50% 75%,#555 75% 100%); }
  .body .wheel.fl { left:14px; } .body .wheel.fr { right:14px; }
  .car.running .body .wheel { animation:wheelspin .45s linear infinite; }
  @keyframes wheelspin { to{transform:rotate(360deg)} }
  .smoke { position:absolute; left:-12px; bottom:2px; width:0; height:0; }
  .smoke i { position:absolute; width:28px; height:28px; border-radius:50%; background:rgba(255,255,255,.9);
    box-shadow:0 0 12px rgba(255,255,255,.9),0 0 3px rgba(0,0,0,.25); opacity:0; }
  .car.running .smoke i { animation:smoke 1.4s ease-out infinite; }
  .car.running .smoke i:nth-child(2){animation-delay:.47s}.car.running .smoke i:nth-child(3){animation-delay:.93s}
  @keyframes smoke { from{transform:translate(0,0) scale(.8);opacity:.95} to{transform:translate(-78px,-52px) scale(2.4);opacity:0} }
  .car .sprite { display:none; position:relative; width:176px; height:88px; margin:6px auto 0;
    background-image:url('/shared/assets/2d/dua-xe-leo-nui/curated/xe-dua-sheet.png');
    background-size:704px 880px; background-repeat:no-repeat; filter:drop-shadow(0 8px 6px rgba(0,0,0,.35)); }
  .car.sprite-on .sprite { display:block; } .car.sprite-on .body { display:none; }
  .sprite.driving { animation:sprite-jitter .25s ease-in-out infinite alternate; }
  @keyframes sprite-jitter { from{transform:translateY(0)} to{transform:translateY(-2px)} }
  .sprite .smoke { left:-12px; bottom:2px; }
  .car.boost { animation:boost .6s ease; }
  @keyframes boost { 0%{transform:rotate(-5deg) scale(1.07)} 100%{transform:rotate(0) scale(1)} }
  .car .driver { position:absolute; left:50%; top:34px; width:64px; height:64px; margin-left:-32px; z-index:4;
    border-radius:50%; overflow:hidden; border:4px solid #fff; box-shadow:0 3px 7px rgba(0,0,0,.55);
    background:#f1a66e; pointer-events:none; }
  .driver img { width:100%; height:100%; object-fit:cover; display:block; }
  .driver-fallback { width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    color:#452719; font-size:34px; font-weight:900; background:linear-gradient(145deg,#ffd0a0 0 58%,#43251d 59%); }
  .car.running .driver { animation:driver-bob .3s ease-in-out infinite alternate; }
  @keyframes driver-bob { from{transform:translateY(0) rotate(-3deg)} to{transform:translateY(-4px) rotate(3deg)} }
  .car .m { font-size:24px; font-weight:900; color:#fff; text-shadow:0 2px 4px rgba(0,0,0,.6); }
  .car.win { animation:winbounce .5s ease-in-out infinite alternate; filter:drop-shadow(0 0 12px #ffe45b); }
  @keyframes winbounce { from{transform:translateY(0)} to{transform:translateY(-12px)} }
  .gift-pop { position:absolute; right:-35px; top:65px; color:#ffe45b; font-size:27px; font-weight:900;
    text-shadow:0 2px 4px #222; animation:gift-pop 1.1s ease-out forwards; pointer-events:none; }
  @keyframes gift-pop { from{opacity:0;transform:translateY(10px) scale(.7)} 20%{opacity:1} to{opacity:0;transform:translateY(-48px) scale(1.1)} }
  .ticker { margin-top:18px; background:rgba(0,0,0,.65); border-radius:16px; padding:12px 20px;
    font-size:27px; min-height:60px; color:#ffe9c4; }
  .howto { margin-top:12px; background:rgba(0,0,0,.65); border:2px solid rgba(255,207,61,.7);
    border-radius:16px; padding:10px 18px; }
  .howto-line { font-size:23px; line-height:1.5; color:#fff; text-shadow:0 2px 4px rgba(0,0,0,.5); }
  .howto-line b { color:#ffe9a0; }
  .banner { display:none; position:absolute; left:36px; right:36px; top:420px; background:rgba(10,20,40,.95);
    border:4px solid #ffcf3d; border-radius:26px; padding:36px 30px; text-align:center; z-index:10;
    box-shadow:0 18px 40px rgba(0,0,0,.6); }
  .banner.show { display:block; }
  .banner h2 { font-size:54px; margin-bottom:12px; }
  .banner p { font-size:30px; color:#ffe9c4; line-height:1.6; }
  .status { position:absolute; bottom:18px; left:36px; right:36px; display:flex;
    justify-content:space-between; font-size:22px; color:rgba(255,255,255,.85); text-shadow:0 2px 4px rgba(0,0,0,.5); }
  #scaler { position:absolute; left:0; top:0; width:1080px; height:1920px; transform-origin:top left; }
</style>
</head>
<body>
<div id="scaler">
  <div class="ui-vignette"></div>
  <div class="ui-grain"></div>
  <div class="ui-toast" id="ui-toast"></div>
  <div id="demo-badge">🧪 DEMO — đang mô phỏng khán giả</div>
  <div class="wrap">
    <header>
      <div><h1>🏁 ĐUA XE LEO NÚI</h1><div class="round" id="roundLabel">Ván #1</div></div>
      <div class="clock" id="clock">05:00</div>
    </header>
    <div class="board" id="board"></div>
    <div class="mountain" id="mountain">
      <div class="ridge far"></div><div class="ridge near"></div>
      <div class="trees">
        <span class="tree" style="left:30px"></span><span class="tree small" style="left:110px"></span>
        <span class="tree" style="left:200px"></span><span class="tree small" style="left:330px"></span>
        <span class="tree" style="left:470px"></span><span class="tree small" style="left:600px"></span>
        <span class="tree" style="left:720px"></span><span class="tree small" style="left:850px"></span><span class="tree" style="left:950px"></span>
      </div>
      <div class="sun"></div><div class="cloud" style="top:60px;left:120px"></div>
      <div class="cloud" style="top:180px;left:420px;animation-duration:32s"></div>
      <div class="flag"><small id="flagLabel">ĐỈNH 500m</small></div>
      <div class="marshal" id="marshal"><div class="marshal-flag"></div><div class="marshal-body"></div><div class="marshal-label">TRỌNG TÀI</div></div>
      <div id="milestones"></div><div id="lanes"></div>
    </div>
    <div class="ticker" id="ticker">🏁 Đường đua đã sẵn sàng!</div>
    <div class="howto" id="howto">
      <div class="howto-line" id="howtoLine1"></div>
      <div class="howto-line" id="howtoLine2"></div>
      <div class="howto-line" id="howtoLine3"></div>
    </div>
    <div class="banner" id="banner"><h2 id="bannerTitle"></h2><p id="bannerText"></p></div>
    <div class="status"><span id="stPhase">Ván #1 — Đang đua</span><span id="stViewers">👥 0 tay đua</span></div>
  </div>
</div>
<audio id="voiceAudio" preload="auto"></audio>
<script src="/socket.io/socket.io.js"></script>
<script src="/shared/music.js"></script>
<script>
var scaler = document.getElementById('scaler');
function fit() {
  var scale = Math.min(window.innerWidth / 1080, window.innerHeight / 1920);
  scaler.style.transform = 'scale(' + scale + ')';
  scaler.style.left = ((window.innerWidth - 1080 * scale) / 2) + 'px';
  scaler.style.top = ((window.innerHeight - 1920 * scale) / 2) + 'px';
}
window.addEventListener('resize', fit); fit();

(function () {
  const $ = id => document.getElementById(id);
  const API_ROOT = location.pathname.replace(/\/$/, '') + '/' + 'api';
  const SPRITE_SHEET = '/shared/assets/2d/dua-xe-leo-nui/curated/xe-dua-sheet.png';
  const CAR_COLORS = [['#FFCF3D','#D9A400'],['#1E90FF','#0B5FA5'],['#A855F7','#6D28D9'],['#22C55E','#15803D'],['#F97316','#C2410C']];
  const SPRITE = {
    rows:{do:{idle:0,drive:512},'xanh-duong':{idle:1024,drive:1536},vang:{idle:2048,drive:2560},'xanh-la':{idle:3072,drive:3584},tim:{idle:4096,drive:4608}},
    frames:{idle:[0,1024,0,3072],drive:[0,1024,2048,3072]}, colorways:['vang','xanh-duong','tim','xanh-la','do'], dispW:176, cellW:1024
  };
  let spriteOk = false, lastState = null, prevMeters = {}, prevPhase = null, marshalTimer = null;
  const spriteImg = new Image();
  spriteImg.onload = () => { spriteOk = true; if (lastState) render(lastState); };
  spriteImg.onerror = () => { spriteOk = false; };
  spriteImg.src = SPRITE_SHEET;
  function tickSprite() {
    const now = Date.now();
    document.querySelectorAll('#lanes .sprite').forEach(el => {
      const state = el.dataset.state === 'drive' ? 'drive' : 'idle';
      const frame = Math.floor(now / (state === 'drive' ? 125 : 250)) % 4;
      const row = SPRITE.rows[el.dataset.colorway] || SPRITE.rows.vang;
      const scale = SPRITE.dispW / SPRITE.cellW;
      el.style.backgroundPosition = (-SPRITE.frames[state][frame] * scale) + 'px ' + (-row[state] * scale) + 'px';
    });
  }
  setInterval(tickSprite, 125);

  function waveFlag(ms) {
    const m = $('marshal'); if (!m) return;
    m.classList.add('waving'); clearTimeout(marshalTimer);
    marshalTimer = setTimeout(() => m.classList.remove('waving'), ms || 3000);
  }
  function esc(value) {
    return String(value == null ? '' : value).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }
  function initial(name) {
    const text = String(name || '?').trim();
    return esc(text.charAt(0).toUpperCase() || '?');
  }
  function avatarMarkup(c, cls) {
    if (c && c.avatar) return '<img class="' + cls + '" src="' + esc(c.avatar) + '" alt="" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'"><span class="' + cls + '-fb" style="display:none">' + initial(c.name) + '</span>';
    return '<span class="' + cls + '-fb">' + initial(c && c.name) + '</span>';
  }
  function driverMarkup(c) {
    if (c.avatar) return '<img src="' + esc(c.avatar) + '" alt="" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'"><span class="driver-fallback" style="display:none">' + initial(c.name) + '</span>';
    return '<span class="driver-fallback">' + initial(c.name) + '</span>';
  }
  function fmtClock(sec) {
    sec = Math.max(0, Math.floor(sec || 0));
    return String(Math.floor(sec / 60)).padStart(2,'0') + ':' + String(sec % 60).padStart(2,'0');
  }
  function fmtM(v) { return String(Number(v)).replace('.', ','); }

  let voiceOn = true, speaking = false, voiceQueue = [], lastCheerAt = 0;
  const voiceAudio = $('voiceAudio');
  function enqueueVoice(files, priority) {
    if (!voiceOn || !files || !files.length) return;
    voiceQueue.push({ files: files.slice(), priority: priority || 1 });
    voiceQueue.sort((a,b) => b.priority - a.priority);
    if (voiceQueue.length > 3) voiceQueue.length = 3;
    pumpVoice();
  }
  const KEOCo_FRAG = '/shared/voice/keo-co/frag/';
  const DUAXE_FRAG = '/shared/voice/dua-xe-leo-nui/frag/';
  const DUAXE_VOICE = '/shared/voice/dua-xe-leo-nui/';
  const DUAXE_CONN = new Set(['da-ve-dich', 'vua-vao-top', 'vua-vuot-moc', 'met']);
  function voiceSrc(name) {
    if (NAME_FRAGS.has(name) || name.indexOf('num-') === 0 || name === 'mot-ban') return KEOCo_FRAG + name + '.mp3';
    if (DUAXE_CONN.has(name)) return DUAXE_FRAG + name + '.mp3';
    return DUAXE_VOICE + name + '.mp3';
  }
  function playVoiceFile(name) {
    return new Promise(resolve => {
      voiceAudio.src = voiceSrc(name);
      voiceAudio.currentTime = 0;
      voiceAudio.onended = resolve;
      voiceAudio.onerror = resolve;
      const result = voiceAudio.play();
      if (result && result.catch) result.catch(resolve);
    });
  }
  async function pumpVoice() {
    if (speaking || !voiceQueue.length || !voiceOn) return;
    speaking = true;
    const item = voiceQueue.shift();
    for (const file of item.files) await playVoiceFile(file);
    speaking = false; pumpVoice();
  }
  function fixedVoice(name, priority) { enqueueVoice([name], priority); }
  const NAME_FRAGS = new Set(('nguyen tran le pham hoang huynh phan vu vo dang bui do ho ngo duong ly van thi minh hong ngoc thanh thu quoc huu duc anh linh tuan huong lan trang phuong nam long hai quan dung thang hung son tung viet huy khanh thao ha mai hoa nga nhung giang chi van2 oanh khoa phuc binh tu demo khach a b c an bao chau cuong dat dien gia hieu khang kien lam loc nghia phong quang tai tam tien toan trung vinh xuan yen cao dinh luu ta truong chu doan luong thai trinh quach').split(' '));
  function normalizeSyllable(s) {
    const lower = String(s || '').toLowerCase().trim();
    if (lower === 'vân') return 'van2';
    return lower.normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/đ/g, 'd').replace(/[^a-z0-9]/g, '');
  }
  function nameToFragments(name) {
    const frags = [];
    for (const part of String(name || '').split(/\s+/)) {
      if (!part) continue;
      if (/^\d+$/.test(part)) {
        frags.push(...numberToFragments(parseInt(part, 10)));
        continue;
      }
      const key = normalizeSyllable(part);
      if (key && NAME_FRAGS.has(key)) frags.push(key);
    }
    return frags.length ? frags : ['mot-ban'];
  }
  function numberToFragments(n) {
    n = Math.round(Math.abs(Number(n) || 0));
    const units = ['', 'num-mot', 'num-hai', 'num-ba', 'num-bon', 'num-nam',
      'num-sau', 'num-bay', 'num-tam', 'num-chin'];
    if (n <= 0) return ['num-mot'];
    const out = [];
    if (n >= 1000) {
      const th = Math.floor(n / 1000);
      out.push(...numberToFragments(th), 'num-nghin');
      n %= 1000;
      if (n === 0) return out;
      if (n < 100) out.push('num-le');
    }
    if (n >= 100) {
      out.push(units[Math.floor(n / 100)], 'num-tram');
      n %= 100;
      if (n === 0) return out;
      if (n < 10) out.push('num-le');
    }
    if (n >= 10) {
      if (n < 20) {
        out.push('num-muoi');
        const u = n % 10;
        if (u === 5) out.push('num-lam');
        else if (u > 0) out.push(units[u]);
        return out;
      }
      out.push(units[Math.floor(n / 10)], 'num-muoi-tens');
      const u = n % 10;
      if (u === 1) out.push('num-mot2');
      else if (u === 5) out.push('num-lam');
      else if (u > 0) out.push(units[u]);
      return out;
    }
    if (n > 0) out.push(units[n]);
    return out;
  }
  function buildWinSentence(name, meters) {
    return nameToFragments(name).concat(['da-ve-dich'], numberToFragments(meters), ['met']);
  }
  function buildTop3Sentence(name, rank) {
    return nameToFragments(name).concat(['vua-vao-top'], numberToFragments(rank));
  }
  function buildMilestoneSentence(name, meters) {
    return nameToFragments(name).concat(['vua-vuot-moc'], numberToFragments(meters), ['met']);
  }

  function render(s) {
    lastState = s;
    const st = s.settings || {};
    voiceOn = !!st.voiceEnabled;
    if (window.StromMusic) window.StromMusic.sync({mood:'edm',enabled:true,volume:50,energy:s.phase === 'racing' ? 2 : 0});
    $('demo-badge').classList.toggle('on', !!s.demoActive);
    $('roundLabel').textContent = 'Ván #' + s.roundNo;
    $('clock').textContent = s.phase === 'racing' ? fmtClock(s.roundSecondsLeft) : '🏁 HẾT VÁN';
    $('clock').classList.toggle('low', s.phase === 'racing' && s.roundSecondsLeft < 60);
    $('flagLabel').textContent = 'ĐỈNH ' + s.trackLength + 'm';

    const mins = (st.roundS || 300) / 60;
    const duration = Number.isInteger(mins) ? mins + ' phút' : (st.roundS || 300) + ' giây';
    $('howtoLine1').innerHTML = '📖 CÁCH CHƠI · 💬 Bình luận <b>+' + fmtM(st.commentMeters ?? 10) + 'm</b> · ❤️ 1 tim <b>+' + fmtM(st.tapMeters ?? .5) + 'm</b> · ➕ Follow <b>+' + fmtM(st.followMeters ?? 5) + 'm</b> → xe streamer';
    $('howtoLine2').innerHTML = '🎁 <b>1 xu = ' + fmtM(st.giftMetersPerCoin ?? 1) + 'm</b> → xe của chính bạn nếu vào <b>Top ' + (st.topN ?? 3) + ' quà</b>, ngoài Top ' + (st.topN ?? 3) + ' đẩy xe streamer';
    $('howtoLine3').innerHTML = '🏁 Đỉnh <b>' + s.trackLength + 'm</b> thắng ngay · ⏱️ Hết <b>' + duration + '</b> xe cao nhất thắng · 🏆 Vinh danh ' + (st.resultsS ?? 30) + 's';

    const cars = s.cars || [], medal = ['🥇','🥈','🥉','4.'];
    $('board').innerHTML = cars.map((c,i) => {
      const pct = Math.min(100, Math.round(100 * c.meters / s.trackLength));
      return '<div class="brow' + (i === 0 && c.meters > 0 ? ' lead' : '') + '"><span>' + (medal[i] || (i + 1) + '.') + '</span>' +
        (c.avatar ? '<img src="' + esc(c.avatar) + '" alt="">' : '<span class="ava">' + initial(c.name) + '</span>') +
        '<div class="binfo"><b>' + esc(c.name) + '</b><div class="ui-bar"><i style="width:' + pct + '%"></i></div></div><span class="pts">' + c.meters + 'm · ' + pct + '%</span></div>';
    }).join('') || '<div style="font-size:26px;color:#ffd9a0">Chưa có xe nào trên đường đua.</div>';

    const lanes = $('lanes'), laneH = 200, laneGap = 28, top0 = 120;
    let html = '';
    cars.forEach((c,i) => {
      const top = top0 + i * (laneH + laneGap);
      const pct = Math.min(100, Math.max(0, 100 * c.meters / s.trackLength));
      const leftPct = 10 + pct * .8;
      const gained = (prevMeters[c.uid] || 0) < c.meters;
      const cc = CAR_COLORS[i % CAR_COLORS.length];
      const cw = SPRITE.colorways[i % SPRITE.colorways.length];
      const win = s.winner && (s.winner.uid === c.uid || (s.winner.type === 'streamer' && c.type === 'streamer'));
      const gift = gained && c.meters - (prevMeters[c.uid] || 0) >= (st.giftMetersPerCoin || 1);
      html += '<div class="lane" style="top:' + top + 'px"><div class="track"></div><div class="car' +
        (win ? ' win' : '') + (s.phase === 'racing' ? ' running' : '') + (gained ? ' boost' : '') + (spriteOk ? ' sprite-on' : '') +
        '" style="left:' + leftPct + '%;--car-c:' + cc[0] + ';--car-c2:' + cc[1] + '">' +
        '<div class="tag"><span class="tag-name" title="' + esc(c.name) + '">' + esc(c.name) + '</span></div>' +
        '<div class="driver">' + driverMarkup(c) + '</div>' +
        '<div class="sprite' + (s.phase === 'racing' ? ' driving' : '') + '" data-colorway="' + cw + '" data-state="' + (s.phase === 'racing' ? 'drive' : 'idle') + '"><span class="smoke"><i></i><i></i><i></i></span></div>' +
        '<div class="body"><div class="cabin"></div><div class="chassis"></div><span class="wheel fl"></span><span class="wheel fr"></span><span class="smoke"><i></i><i></i><i></i></span></div><div class="m">' + c.meters + 'm</div>' +
        (gift ? '<div class="gift-pop">+' + (c.meters - (prevMeters[c.uid] || 0)) + 'm</div>' : '') + '</div></div>';
    });
    lanes.innerHTML = html; tickSprite();
    prevMeters = {}; cars.forEach(c => { prevMeters[c.uid] = c.meters; });

    $('milestones').innerHTML = [.25,.5,.75].map(f => '<div class="milestone" style="left:' + (10 + f * 80) + '%"><span>' + Math.round(s.trackLength * f) + 'm</span></div>').join('');
    const last = (s.logs || []).slice(-1)[0]; if (last) $('ticker').textContent = last.text;
    if (s.phase === 'results' && prevPhase === 'racing') waveFlag(6000);
    prevPhase = s.phase;
    $('stPhase').textContent = 'Ván #' + s.roundNo + ' — ' + (s.phase === 'racing' ? 'Đang đua' : 'Bảng vinh danh');
    $('stViewers').textContent = '👥 ' + (s.viewersOnline || 0) + ' tay đua';

    const banner = $('banner');
    if (s.phase === 'results' && s.results) {
      const w = s.results.winner;
      banner.className = 'banner show';
      $('bannerTitle').textContent = '🏆 ' + w.name + ' VỀ ĐÍCH!';
      $('bannerText').innerHTML = s.results.standings.map(x => (medal[x.rank - 1] || x.rank + '.') + ' ' + esc(x.name) + ' — ' + x.meters + 'm').join('<br>') +
        '<br>🚗 Xe streamer: ' + s.results.streamer.meters + 'm (' + s.results.streamer.comments + ' comment + ' + s.results.streamer.taps + ' tim + ' + s.results.streamer.giftMeters + 'm quà ngoài top 3)' +
        '<br>⏱️ Thời gian ván: ' + Math.floor(s.results.durationS / 60) + ':' + String(s.results.durationS % 60).padStart(2,'0') + ' / ' + fmtClock(st.roundS) +
        '<br>Ván mới bắt đầu sau ' + (st.resultsS || 30) + 's…';
    } else banner.className = 'banner';

    if (s.phase === 'racing' && Date.now() - lastCheerAt > 90000 && !voiceQueue.length && !speaking) {
      lastCheerAt = Date.now(); fixedVoice(Math.random() < .5 ? 'cheer-1' : 'cheer-2', 1);
    }
  }

  function poll() { fetch(API_ROOT + '/state').then(r => r.json()).then(render).catch(() => {}); }
  poll(); setInterval(poll, 2000);

  if (new URLSearchParams(location.search).get('demo') === '1') {
    fetch(API_ROOT + '/state').then(r => r.json()).then(st => {
      if ((st.webhookCount || 0) > 0) return;
      return fetch(API_ROOT + '/settings', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({demoMode:true})})
        .then(() => fetch(API_ROOT + '/test/demo', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'start'})}));
    }).catch(() => {});
  }

  const socket = io();
  socket.on('state-update', render);
  socket.on('win', d => {
    waveFlag(6000);
    if (d.winner) enqueueVoice(buildWinSentence(d.winner.name, d.winner.meters || 0), 4);
    if (window.StromUI) { StromUI.confetti(48); StromUI.sfx('win'); }
  });
  socket.on('top3-enter', d => {
    enqueueVoice(buildTop3Sentence(d.name, d.rank), 3);
    if (window.StromUI) StromUI.sfx('success');
  });
  socket.on('milestone', d => {
    waveFlag(3000);
    // Engine emit {key:'Tên-500', text:'🚩 Tên vừa vượt mốc 500m!'} — parse key lấy tên + mét.
    const keyParts = String(d.key || '').split('-');
    const meters = parseInt(keyParts[keyParts.length - 1], 10);
    const mName = keyParts.slice(0, -1).join('-');
    if (mName && Number.isFinite(meters)) enqueueVoice(buildMilestoneSentence(mName, meters), 2);
    if (window.StromUI) StromUI.sfx('pop');
    document.querySelectorAll('.milestone').forEach(x => x.classList.add('hit'));
    setTimeout(() => document.querySelectorAll('.milestone').forEach(x => x.classList.remove('hit')), 900);
  });
  socket.on('last-minute', () => fixedVoice('last-minute', 5));
  socket.on('new-race', () => { if (window.StromUI) StromUI.sfx('start'); });
})();
</script>
